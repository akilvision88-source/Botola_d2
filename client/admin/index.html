<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#A200C7" />
  <title>Admin Login — BOTOLA D2</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>

  <main class="ad-login-shell">
    <div class="ad-login-bg"></div>

    <div class="ad-login-card">
      <div class="ad-login-brand">
        BOTOLA <span class="d2">D2</span>
      </div>
      <div class="ad-login-title">Admin Console</div>

      <form id="adminLoginForm" class="ad-form" autocomplete="on">
        <div class="ad-field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
            placeholder="admin@botolad2.com"
          />
        </div>

        <div class="ad-field">
          <label for="password">Password</label>
          <div style="position:relative">
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              required
              placeholder="••••••••"
              style="padding-right:44px"
            />
            <button
              type="button"
              id="togglePwd"
              style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:#6e6e6e;padding:8px;cursor:pointer"
              aria-label="Show password"
            >
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="ad-btn ad-btn-primary ad-btn-block" id="loginBtn" style="padding:13px">
          <i class="fa-solid fa-right-to-bracket"></i> <span>Log in</span>
        </button>

        <p style="text-align:center;font-size:12px;color:#6e6e6e;margin:6px 0 0">
          <a href="/" style="color:#A200C7">← Back to site</a>
        </p>
      </form>
    </div>
  </main>

  <div class="ad-toast-wrap" id="adToastWrap"></div>

  <script src="/js/config.js"></script>
  <script src="/js/admin/admin-api.js"></script>
  <script src="/js/admin/admin-shell.js"></script>
  <script>
    /* =========================================================
       Toggle password visibility
       ========================================================= */
    (function bindPasswordToggle() {
      const btn = document.getElementById('togglePwd');
      const inp = document.getElementById('password');
      if (!btn || !inp) return;

      btn.addEventListener('click', function () {
        const isPwd = inp.type === 'password';
        inp.type = isPwd ? 'text' : 'password';
        btn.innerHTML = '<i class="fa-regular ' + (isPwd ? 'fa-eye-slash' : 'fa-eye') + '"></i>';
      });
    })();

    /* =========================================================
       Login form submission
       ========================================================= */
    (function bindLoginForm() {
      const form = document.getElementById('adminLoginForm');
      if (!form) return;

      form.addEventListener('submit', async function (e) {
        e.preventDefault();

        const email = document.getElementById('email').value.trim().toLowerCase();
        const password = document.getElementById('password').value;

        if (!email || !password) {
          AdToast.error('Please fill all fields');
          return;
        }

        const btn = document.getElementById('loginBtn');
        const originalHTML = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>Logging in...</span>';

        try {
          const res = await AdminAPI.login(email, password);
          const data = res && res.data;

          if (!data || !data.accessToken) {
            throw new Error('Invalid login response');
          }

          const user = data.user;
          const roleSlug = user && user.role && user.role.slug;
          const isAdmin = roleSlug && ['super_admin', 'admin', 'editor', 'moderator'].indexOf(roleSlug) !== -1;

          if (!isAdmin) {
            AdToast.error('This account does not have admin access');
            btn.disabled = false;
            btn.innerHTML = originalHTML;
            return;
          }

          // Persist session
          localStorage.setItem(window.BD_CONFIG.TOKEN_KEY, data.accessToken);
          if (data.refreshToken) {
            localStorage.setItem(window.BD_CONFIG.REFRESH_KEY, data.refreshToken);
          }
          localStorage.setItem(window.BD_CONFIG.USER_KEY, JSON.stringify(user));

          // Mark as fresh login (allow one auto-redirect)
          sessionStorage.removeItem('admin_redirected');

          AdToast.success('Welcome, ' + (user.full_name || 'Admin'));

          // Small delay for toast visibility, then navigate
          setTimeout(function () {
            window.location.replace('/admin/dashboard.html');
          }, 500);

        } catch (err) {
          AdToast.error((err && err.message) || 'Login failed');
          btn.disabled = false;
          btn.innerHTML = originalHTML;
        }
      });
    })();

    /* =========================================================
       Auto-redirect if ALREADY logged in
       — safe: no API call, no loop, uses sessionStorage guard
       ========================================================= */
    (function autoRedirectIfLoggedIn() {
      const token = localStorage.getItem(window.BD_CONFIG.TOKEN_KEY);
      const userJson = localStorage.getItem(window.BD_CONFIG.USER_KEY);

      if (!token || !userJson) return;

      // Prevent redirect loops — only redirect once per session
      if (sessionStorage.getItem('admin_redirected') === '1') {
        return;
      }

      try {
        const user = JSON.parse(userJson);
        const roleSlug = user && user.role && user.role.slug;
        const isAdmin = roleSlug && ['super_admin', 'admin', 'editor', 'moderator'].indexOf(roleSlug) !== -1;

        if (!isAdmin) {
          // Not an admin — clear stale session
          localStorage.removeItem(window.BD_CONFIG.TOKEN_KEY);
          localStorage.removeItem(window.BD_CONFIG.USER_KEY);
          return;
        }

        // Mark as redirected for this session (prevents loop if dashboard bounces back)
        sessionStorage.setItem('admin_redirected', '1');

        // Redirect to dashboard
        window.location.replace('/admin/dashboard.html');

      } catch (err) {
        // Invalid JSON — clean up
        localStorage.removeItem(window.BD_CONFIG.USER_KEY);
      }
    })();

    /* =========================================================
       Focus email field on load
       ========================================================= */
    window.addEventListener('load', function () {
      const emailInput = document.getElementById('email');
      if (emailInput && !emailInput.value) {
        emailInput.focus();
      }
    });
  </script>
</body>
</html>
