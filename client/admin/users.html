<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#A200C7" />
  <title>Users — BOTOLA D2 Admin</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>

  <div class="ad-layout" id="adLayout">
    <aside class="ad-sidebar" id="adSidebar"></aside>
    <div class="ad-sidebar-overlay" id="adSidebarOverlay"></div>

    <div class="ad-main">
      <header class="ad-topbar" id="adTopbar"></header>

      <div class="ad-content">
        <div class="ad-page-head">
          <div>
            <h1 class="ad-page-title">Users</h1>
            <p class="ad-page-sub">Manage accounts, roles and subscriptions</p>
          </div>
          <div class="ad-page-actions">
            <button class="ad-btn ad-btn-ghost ad-btn-sm" id="refreshBtn">
              <i class="fa-solid fa-rotate"></i> Refresh
            </button>
            <button class="ad-btn ad-btn-primary ad-btn-sm" id="addBtn">
              <i class="fa-solid fa-user-plus"></i> Add User
            </button>
          </div>
        </div>

        <div class="ad-card">
          <div class="ad-card-body" style="padding:16px 20px">
            <div class="ad-form-grid-3" style="gap:14px">
              <div class="ad-field">
                <label>Search</label>
                <input type="text" id="filterSearch" placeholder="Name / email / phone..." />
              </div>
              <div class="ad-field">
                <label>Role</label>
                <select id="filterRole">
                  <option value="">All roles</option>
                  <option value="1">Super Admin</option>
                  <option value="2">Admin</option>
                  <option value="3">Editor</option>
                  <option value="4">Moderator</option>
                  <option value="5">User</option>
                </select>
              </div>
              <div class="ad-field">
                <label>Status</label>
                <select id="filterStatus">
                  <option value="">All statuses</option>
                  <option value="active">Active</option>
                  <option value="suspended">Suspended</option>
                  <option value="inactive">Inactive</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div class="ad-card">
          <div class="ad-card-head">
            <h2 class="ad-card-title"><i class="fa-solid fa-users"></i> All Users</h2>
            <span style="color:var(--bd-text-dim);font-size:12px" id="countLabel">—</span>
          </div>
          <div class="ad-table-wrap">
            <table class="ad-table">
              <thead>
                <tr>
                  <th>User</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Role</th>
                  <th>Plan</th>
                  <th>Status</th>
                  <th>Registered</th>
                  <th style="text-align:right">Actions</th>
                </tr>
              </thead>
              <tbody id="usersBody">
                <tr><td colspan="8"><div class="ad-skeleton" style="height:52px"></div></td></tr>
              </tbody>
            </table>
          </div>
          <div class="ad-pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ USER MODAL ============ -->
  <div class="ad-modal" id="userModal">
    <div class="ad-modal-backdrop" data-modal-close></div>
    <div class="ad-modal-panel">
      <div class="ad-modal-head">
        <h3 class="ad-modal-title" id="modalTitle">Add User</h3>
        <button class="ad-modal-close" data-modal-close><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form id="userForm" class="ad-form" style="padding:22px">
        <input type="hidden" name="id" id="userId" />

        <div class="ad-form-grid">
          <div class="ad-field">
            <label>Full Name</label>
            <input type="text" name="full_name" required maxlength="120" />
          </div>
          <div class="ad-field">
            <label>Email</label>
            <input type="email" name="email" required />
          </div>
        </div>

        <div class="ad-form-grid">
          <div class="ad-field">
            <label>Phone</label>
            <input type="tel" name="phone" maxlength="30" />
          </div>
          <div class="ad-field">
            <label>Role</label>
            <select name="role_id" id="roleSelect" required>
              <option value="1">Super Admin</option>
              <option value="2">Admin</option>
              <option value="3">Editor</option>
              <option value="4">Moderator</option>
              <option value="5" selected>User</option>
            </select>
          </div>
        </div>

        <div class="ad-form-grid" id="passwordRow">
          <div class="ad-field">
            <label>Password <span class="hint" id="pwHint">(min 8 chars)</span></label>
            <input type="password" name="password" minlength="8" autocomplete="new-password" />
          </div>
          <div class="ad-field">
            <label>Confirm Password</label>
            <input type="password" name="confirm_password" autocomplete="new-password" />
          </div>
        </div>

        <div class="ad-form-grid">
          <div class="ad-field">
            <label>Subscription Plan</label>
            <select name="subscription_plan_id" id="planSelect">
              <option value="">— None —</option>
            </select>
          </div>
          <div class="ad-field">
            <label>Account Status</label>
            <select name="status">
              <option value="active">Active</option>
              <option value="suspended">Suspended</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
        </div>

        <div class="ad-form-grid">
          <div class="ad-field">
            <label>Subscription Status</label>
            <select name="subscription_status">
              <option value="active">Active</option>
              <option value="pending">Pending</option>
              <option value="expired">Expired</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
          <div class="ad-field">
            <label>Preferred Language</label>
            <select name="language">
              <option value="fr">Français</option>
              <option value="en">English</option>
              <option value="ar">العربية</option>
            </select>
          </div>
        </div>

        <div style="display:flex;justify-content:flex-end;gap:10px;padding-top:10px;border-top:1px solid var(--ad-border);margin-top:6px">
          <button type="button" class="ad-btn ad-btn-ghost" data-modal-close>Cancel</button>
          <button type="submit" class="ad-btn ad-btn-primary" id="saveBtn">
            <i class="fa-solid fa-floppy-disk"></i> Save User
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="ad-toast-wrap" id="adToastWrap"></div>

  <script src="/js/config.js"></script>
  <script src="/js/admin/admin-api.js"></script>
  <script src="/js/admin/admin-shell.js"></script>
  <script src="/js/admin/users.js"></script>
</body>
</html>
