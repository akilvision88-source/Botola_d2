<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#A200C7" />
  <title>Notifications — BOTOLA D2 Admin</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>

  <div class="ad-layout" id="adLayout">
    <aside class="ad-sidebar" id="adSidebar"></aside>
    <div class="ad-sidebar-overlay" id="adSidebarOverlay"></div>

    <div class="ad-main">
      <header class="ad-topbar" id="adTopbar"></header>

      <div class="ad-content">
        <div class="ad-page-head">
          <div>
            <h1 class="ad-page-title">Notifications</h1>
            <p class="ad-page-sub">Toutes les activités de la plateforme</p>
          </div>
          <div class="ad-page-actions">
            <button class="ad-btn ad-btn-ghost ad-btn-sm" id="refreshBtn">
              <i class="fa-solid fa-rotate"></i> Rafraîchir
            </button>
            <button class="ad-btn ad-btn-ghost ad-btn-sm" id="markAllBtn">
              <i class="fa-solid fa-check-double"></i> Tout marquer comme lu
            </button>
            <button class="ad-btn ad-btn-danger ad-btn-sm" id="clearAllBtn">
              <i class="fa-solid fa-trash"></i> Tout effacer
            </button>
          </div>
        </div>

        <!-- Filters -->
        <div class="ad-card">
          <div class="ad-card-body" style="padding:16px 20px">
            <div class="ad-form-grid" style="gap:14px">
              <div class="ad-field">
                <label>Type</label>
                <select id="filterType">
                  <option value="">Tous les types</option>
                  <option value="new_user">👤 Nouvel utilisateur</option>
                  <option value="new_subscription">⭐ Nouvel abonnement</option>
                  <option value="new_payment">💰 Paiement initié</option>
                  <option value="payment_completed">✅ Paiement confirmé</option>
                  <option value="new_message">📧 Nouveau message</option>
                  <option value="new_replay">🎬 Nouvelle rediffusion</option>
                  <option value="system">⚙️ Système</option>
                </select>
              </div>
              <div class="ad-field">
                <label>Statut</label>
                <select id="filterStatus">
                  <option value="">Tous</option>
                  <option value="false">Non lues</option>
                  <option value="true">Lues</option>
                </select>
              </div>
              <div class="ad-field">
                <label>Priorité</label>
                <select id="filterPriority">
                  <option value="">Toutes</option>
                  <option value="urgent">🔴 Urgent</option>
                  <option value="high">🟠 Haute</option>
                  <option value="normal">🟡 Normale</option>
                  <option value="low">⚪ Basse</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- Notifications List -->
        <div class="ad-card">
          <div class="ad-card-head">
            <h2 class="ad-card-title">
              <i class="fa-solid fa-bell"></i> Toutes les notifications
            </h2>
            <span style="color:var(--bd-text-dim);font-size:12px" id="countLabel">—</span>
          </div>
          <div class="ad-table-wrap">
            <table class="ad-table">
              <thead>
                <tr>
                  <th style="width:60px">Type</th>
                  <th>Notification</th>
                  <th style="width:140px">Utilisateur</th>
                  <th style="width:100px">Priorité</th>
                  <th style="width:160px">Date</th>
                  <th style="width:100px;text-align:right">Actions</th>
                </tr>
              </thead>
              <tbody id="notifBody">
                <tr><td colspan="6"><div class="ad-skeleton" style="height:52px"></div></td></tr>
              </tbody>
            </table>
          </div>
          <div class="ad-pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ DETAIL MODAL ============ -->
  <div class="ad-modal" id="detailModal">
    <div class="ad-modal-backdrop" data-modal-close></div>
    <div class="ad-modal-panel lg">
      <div class="ad-modal-head">
        <h3 class="ad-modal-title" id="detailTitle">Détails</h3>
        <button class="ad-modal-close" data-modal-close><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="ad-modal-body" id="detailBody"></div>
    </div>
  </div>

  <div class="ad-toast-wrap" id="adToastWrap"></div>

  <script src="/js/config.js"></script>
  <script src="/js/admin/admin-api.js"></script>
  <script src="/js/admin/admin-shell.js"></script>
  <script src="/js/admin/notifications.js?v=3"></script>
</body>
</html>
