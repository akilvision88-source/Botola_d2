<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#A200C7" />
  <title>Messages — BOTOLA D2 Admin</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>

  <div class="ad-layout" id="adLayout">
    <aside class="ad-sidebar" id="adSidebar"></aside>
    <div class="ad-sidebar-overlay" id="adSidebarOverlay"></div>

    <div class="ad-main">
      <header class="ad-topbar" id="adTopbar"></header>

      <div class="ad-content">
        <div class="ad-page-head">
          <div>
            <h1 class="ad-page-title">Messages</h1>
            <p class="ad-page-sub">Contact form submissions from visitors</p>
          </div>
          <div class="ad-page-actions">
            <button class="ad-btn ad-btn-ghost ad-btn-sm" id="refreshBtn">
              <i class="fa-solid fa-rotate"></i> Refresh
            </button>
          </div>
        </div>

        <div class="ad-card">
          <div class="ad-card-body" style="padding:16px 20px">
            <div class="ad-form-grid" style="gap:14px">
              <div class="ad-field">
                <label>Search</label>
                <input type="text" id="filterSearch" placeholder="Name / email / subject..." />
              </div>
              <div class="ad-field">
                <label>Status</label>
                <select id="filterStatus">
                  <option value="">All</option>
                  <option value="new">New</option>
                  <option value="read">Read</option>
                  <option value="replied">Replied</option>
                  <option value="archived">Archived</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div class="ad-card">
          <div class="ad-card-head">
            <h2 class="ad-card-title"><i class="fa-solid fa-envelope"></i> Inbox</h2>
            <span style="color:var(--bd-text-dim);font-size:12px" id="countLabel">—</span>
          </div>
          <div class="ad-table-wrap">
            <table class="ad-table">
              <thead>
                <tr>
                  <th>From</th>
                  <th>Contact</th>
                  <th>Subject</th>
                  <th>Message</th>
                  <th>Status</th>
                  <th>Received</th>
                  <th style="text-align:right">Actions</th>
                </tr>
              </thead>
              <tbody id="messagesBody">
                <tr><td colspan="7"><div class="ad-skeleton" style="height:52px"></div></td></tr>
              </tbody>
            </table>
          </div>
          <div class="ad-pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ MESSAGE MODAL ============ -->
  <div class="ad-modal" id="messageModal">
    <div class="ad-modal-backdrop" data-modal-close></div>
    <div class="ad-modal-panel">
      <div class="ad-modal-head">
        <h3 class="ad-modal-title" id="messageTitle">Message</h3>
        <button class="ad-modal-close" data-modal-close><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="ad-modal-body">
        <div style="display:flex;gap:14px;align-items:flex-start;padding:16px;background:var(--ad-bg-2);border-radius:12px;margin-bottom:18px">
          <div class="ad-avatar-cell">
            <span class="initials" id="msgInitials">?</span>
          </div>
          <div style="flex:1">
            <div style="color:#fff;font-weight:700;font-size:14px" id="msgFromName">—</div>
            <div style="color:var(--bd-text-muted);font-size:12.5px" id="msgFromEmail">—</div>
            <div style="color:var(--bd-text-dim);font-size:12px;margin-top:4px" id="msgFromPhone"></div>
          </div>
        </div>

        <div style="margin-bottom:18px">
          <div style="font-size:11.5px;color:var(--bd-text-dim);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:6px">Subject</div>
          <div style="color:#fff;font-size:15px;font-weight:700" id="msgSubject">—</div>
        </div>

        <div style="margin-bottom:20px">
          <div style="font-size:11.5px;color:var(--bd-text-dim);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:8px">Message</div>
          <div style="color:var(--bd-text-muted);font-size:13.5px;line-height:1.75;white-space:pre-wrap;padding:16px;background:var(--ad-bg-2);border-radius:12px" id="msgBody">—</div>
        </div>

        <div class="ad-form-grid">
          <div class="ad-field">
            <label>Status</label>
            <select id="msgStatus">
              <option value="new">New</option>
              <option value="read">Read</option>
              <option value="replied">Replied</option>
              <option value="archived">Archived</option>
            </select>
          </div>
          <div style="display:flex;align-items:flex-end">
            <a id="msgReply" href="#" class="ad-btn ad-btn-primary ad-btn-block">
              <i class="fa-solid fa-reply"></i> Reply by email
            </a>
          </div>
        </div>
      </div>

      <div class="ad-modal-foot">
        <button class="ad-btn ad-btn-danger" id="msgDeleteBtn">
          <i class="fa-solid fa-trash"></i> Delete
        </button>
        <button class="ad-btn ad-btn-primary" id="msgSaveBtn">
          <i class="fa-solid fa-floppy-disk"></i> Save status
        </button>
      </div>
    </div>
  </div>

  <div class="ad-toast-wrap" id="adToastWrap"></div>

  <script src="/js/config.js"></script>
  <script src="/js/admin/admin-api.js"></script>
  <script src="/js/admin/admin-shell.js"></script>
  <script src="/js/admin/messages.js"></script>
</body>
</html>
