<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#A200C7" />
  <title>Live Matches — BOTOLA D2 Admin</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>

  <div class="ad-layout" id="adLayout">
    <aside class="ad-sidebar" id="adSidebar"></aside>
    <div class="ad-sidebar-overlay" id="adSidebarOverlay"></div>

    <div class="ad-main">
      <header class="ad-topbar" id="adTopbar"></header>

      <div class="ad-content">
        <div class="ad-page-head">
          <div>
            <h1 class="ad-page-title">Live Matches</h1>
            <p class="ad-page-sub">Manage matches currently in progress</p>
          </div>
          <div class="ad-page-actions">
            <button class="ad-btn ad-btn-ghost ad-btn-sm" id="refreshBtn">
              <i class="fa-solid fa-rotate"></i> Refresh
            </button>
            <button class="ad-btn ad-btn-primary ad-btn-sm" id="addBtn">
              <i class="fa-solid fa-plus"></i> Add Live Match
            </button>
          </div>
        </div>

        <div class="ad-card">
          <div class="ad-card-body" style="padding:16px 20px">
            <div class="ad-form-grid" style="gap:14px">
              <div class="ad-field">
                <label>Status</label>
                <select id="filterStatus">
                  <option value="live">Live</option>
                  <option value="halftime">Half-time</option>
                  <option value="live,halftime" selected>Live + Half-time</option>
                </select>
              </div>
              <div class="ad-field">
                <label>Search (competition / city)</label>
                <input type="text" id="filterSearch" placeholder="Search..." />
              </div>
            </div>
          </div>
        </div>

        <div class="ad-card">
          <div class="ad-card-head">
            <h2 class="ad-card-title"><i class="fa-solid fa-tv"></i> Matches</h2>
            <span style="color:var(--bd-text-dim);font-size:12px" id="countLabel">—</span>
          </div>
          <div class="ad-table-wrap">
            <table class="ad-table">
              <thead>
                <tr>
                  <th style="width:60px">Bg</th>
                  <th>Competition</th>
                  <th>Match</th>
                  <th>Score</th>
                  <th>Minute</th>
                  <th>Stadium</th>
                  <th>Date</th>
                  <th style="text-align:right">Actions</th>
                </tr>
              </thead>
              <tbody id="matchesBody">
                <tr><td colspan="8"><div class="ad-skeleton" style="height:52px"></div></td></tr>
              </tbody>
            </table>
          </div>
          <div class="ad-pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ MATCH MODAL ============ -->
  <div class="ad-modal" id="matchModal">
    <div class="ad-modal-backdrop" data-modal-close></div>
    <div class="ad-modal-panel lg">
      <div class="ad-modal-head">
        <h3 class="ad-modal-title" id="modalTitle">Add Live Match</h3>
        <button class="ad-modal-close" data-modal-close><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form id="matchForm" class="ad-form" style="padding:22px">
        <input type="hidden" name="id" id="matchId" />

        <div class="ad-form-grid">
          <div class="ad-field">
            <label>Competition</label>
            <input type="text" name="competition" value="Botola D2" required maxlength="120" />
          </div>
          <div class="ad-field">
            <label>Round</label>
            <input type="text" name="round" maxlength="50" placeholder="e.g. Round 12" />
          </div>
        </div>

        <div class="ad-form-grid">
          <div class="ad-field">
            <label>Home Team</label>
            <select name="team_home_id" id="teamHome" required></select>
          </div>
          <div class="ad-field">
            <label>Away Team</label>
            <select name="team_away_id" id="teamAway" required></select>
          </div>
        </div>

        <div class="ad-form-grid-3">
          <div class="ad-field">
            <label>Home Score</label>
            <input type="number" name="score_home" min="0" max="99" value="0" />
          </div>
          <div class="ad-field">
            <label>Away Score</label>
            <input type="number" name="score_away" min="0" max="99" value="0" />
          </div>
          <div class="ad-field">
            <label>Match Minute</label>
            <input type="number" name="match_minute" min="0" max="130" value="0" />
          </div>
        </div>

        <div class="ad-form-grid-3">
          <div class="ad-field">
            <label>Status</label>
            <select name="status">
              <option value="live">Live</option>
              <option value="halftime">Half-time</option>
              <option value="upcoming">Upcoming</option>
              <option value="finished">Finished</option>
              <option value="postponed">Postponed</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
          <div class="ad-field">
            <label>Date</label>
            <input type="date" name="match_date" required />
          </div>
          <div class="ad-field">
            <label>Time</label>
            <input type="time" name="match_time" required />
          </div>
        </div>

        <div class="ad-form-grid">
          <div class="ad-field">
            <label>Stadium</label>
            <select name="stadium_id" id="stadiumSelect"></select>
          </div>
          <div class="ad-field">
            <label>City</label>
            <input type="text" name="city" maxlength="100" placeholder="e.g. Casablanca" />
          </div>
        </div>

        <div class="ad-form-grid">
          <div class="ad-field">
            <label>Referee</label>
            <input type="text" name="referee" maxlength="120" placeholder="Referee name" />
          </div>
          <div class="ad-field">
            <label>Attendance</label>
            <input type="number" name="attendance" min="0" placeholder="e.g. 45000" />
          </div>
        </div>

        <div class="ad-field">
          <label>Stream URL <span class="hint">(HLS / M3U8 / MP4 — must be licensed)</span></label>
          <input type="url" name="stream_url" maxlength="500" placeholder="https://..." />
        </div>

        <div class="ad-field">
          <label>Thumbnail URL <span class="hint">(optional)</span></label>
          <input type="url" name="thumbnail" maxlength="255" placeholder="https://..." />
        </div>

        <!-- ============ CARD BACKGROUND ============ -->
        <div style="padding:16px;background:rgba(162,0,199,0.06);border:1px solid rgba(162,0,199,0.25);border-radius:12px">
          <div style="font-size:12px;font-weight:800;color:var(--bd-primary);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;display:flex;align-items:center;gap:8px">
            <i class="fa-solid fa-image"></i> Card Background
          </div>

          <div class="ad-field">
            <label>Background URL <span class="hint">(صورة خلفية البطاقة)</span></label>
            <input type="url" name="card_background" maxlength="500"
                   placeholder="https://example.com/stadium.jpg" />
          </div>

          <div style="text-align:center;color:var(--bd-text-dim);font-size:11px;margin:12px 0">— OR —</div>

          <div class="ad-upload">
            <div class="ad-upload-preview" id="bgPreview" style="width:180px;height:100px;border-radius:12px">
              <i class="fa-regular fa-image"></i>
            </div>
            <div class="ad-upload-input">
              <label for="bgInput">
                <i class="fa-solid fa-upload"></i> Upload background image
              </label>
              <input type="file" id="bgInput" name="card_background_file" accept="image/*" />
              <div style="color:var(--bd-text-dim);font-size:11px;margin-top:8px">
                صورة أفقية (16:9 موصى به) — max 5MB
              </div>
            </div>
          </div>

          <div style="margin-top:12px;text-align:right">
            <button type="button" class="ad-btn ad-btn-ghost ad-btn-sm" id="clearBgBtn" style="display:none">
              <i class="fa-solid fa-trash"></i> Clear background
            </button>
          </div>
        </div>

        <!-- ============ PRE-ROLL AD ============ -->
        <div style="padding:16px;background:rgba(255,200,87,0.06);border:1px solid rgba(255,200,87,0.25);border-radius:12px">
          <div style="font-size:12px;font-weight:800;color:var(--bd-gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;display:flex;align-items:center;gap:8px">
            <i class="fa-solid fa-rectangle-ad"></i> Pre-roll Ad (optional)
          </div>

          <div class="ad-field">
            <label>Ad Video URL <span class="hint">(MP4 / HLS — يعرض قبل البث)</span></label>
            <input type="url" name="ad_video_url" maxlength="500"
                   placeholder="https://example.com/ad.mp4" />
          </div>

          <div class="ad-form-grid">
            <div class="ad-field">
              <label>Ad Duration (seconds)</label>
              <input type="number" name="ad_duration" min="5" max="120" value="15" />
            </div>
            <div class="ad-field">
              <label>Skip After (seconds)</label>
              <input type="number" name="ad_skip_after" min="0" max="60" value="5" />
            </div>
          </div>

          <div style="color:var(--bd-text-dim);font-size:11px;margin-top:8px;line-height:1.5">
            <i class="fa-solid fa-circle-info"></i>
            اتركه فارغاً إذا لم تريد إعلاناً. المستخدم يرى زر "تخطي" بعد عدد الثواني المحدد.
          </div>
        </div>

        <div style="display:flex;justify-content:flex-end;gap:10px;padding-top:10px;border-top:1px solid var(--ad-border);margin-top:6px">
          <button type="button" class="ad-btn ad-btn-ghost" data-modal-close>Cancel</button>
          <button type="submit" class="ad-btn ad-btn-primary" id="saveBtn">
            <i class="fa-solid fa-floppy-disk"></i> Save Match
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="ad-toast-wrap" id="adToastWrap"></div>

  <script src="/js/config.js"></script>
  <script src="/js/admin/admin-api.js"></script>
  <script src="/js/admin/admin-shell.js"></script>
  <script>
    window.ADMIN_MATCH_MODE = 'live';
  </script>
  <script src="/js/admin/matches.js?v=4"></script>
</body>
</html>
