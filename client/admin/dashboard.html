<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#A200C7" />
  <title>Dashboard — BOTOLA D2 Admin</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>

  <div class="ad-layout" id="adLayout">
    <aside class="ad-sidebar" id="adSidebar"></aside>
    <div class="ad-sidebar-overlay" id="adSidebarOverlay"></div>

    <div class="ad-main">
      <header class="ad-topbar" id="adTopbar"></header>

      <div class="ad-content">
        <div class="ad-page-head">
          <div>
            <h1 class="ad-page-title">Dashboard</h1>
            <p class="ad-page-sub">Overview of your platform activity</p>
          </div>
          <div class="ad-page-actions">
            <button class="ad-btn ad-btn-ghost ad-btn-sm" id="refreshBtn">
              <i class="fa-solid fa-rotate"></i> Refresh
            </button>
            <a href="/admin/live-matches.html" class="ad-btn ad-btn-primary ad-btn-sm">
              <i class="fa-solid fa-plus"></i> Add Live Match
            </a>
          </div>
        </div>

        <!-- ═══════════════ STATS GRID 1 — Users & Money ═══════════════ -->
        <div class="ad-stats-grid" id="statsGrid">
          <div class="ad-stat-card"><div class="ad-skeleton" style="height:90px"></div></div>
          <div class="ad-stat-card"><div class="ad-skeleton" style="height:90px"></div></div>
          <div class="ad-stat-card"><div class="ad-skeleton" style="height:90px"></div></div>
          <div class="ad-stat-card"><div class="ad-skeleton" style="height:90px"></div></div>
        </div>

        <!-- ═══════════════ STATS GRID 2 — Content & Messages ═══════════════ -->
        <div class="ad-stats-grid" id="statsGrid2">
          <div class="ad-stat-card"><div class="ad-skeleton" style="height:90px"></div></div>
          <div class="ad-stat-card"><div class="ad-skeleton" style="height:90px"></div></div>
          <div class="ad-stat-card"><div class="ad-skeleton" style="height:90px"></div></div>
          <div class="ad-stat-card"><div class="ad-skeleton" style="height:90px"></div></div>
        </div>

        <!-- ═══════════════ STATS GRID 3 — Extra Stats ═══════════════ -->
        <div class="ad-stats-grid" id="statsGrid3">
          <div class="ad-stat-card"><div class="ad-skeleton" style="height:90px"></div></div>
          <div class="ad-stat-card"><div class="ad-skeleton" style="height:90px"></div></div>
          <div class="ad-stat-card"><div class="ad-skeleton" style="height:90px"></div></div>
          <div class="ad-stat-card"><div class="ad-skeleton" style="height:90px"></div></div>
        </div>

        <!-- ═══════════════ CHARTS ═══════════════ -->
        <div class="ad-two-col">
          <div class="ad-card">
            <div class="ad-card-head">
              <h2 class="ad-card-title"><i class="fa-solid fa-chart-line"></i> New Users (last 7 days)</h2>
              <span style="color:var(--bd-text-dim);font-size:12px" id="chartRange">—</span>
            </div>
            <div class="ad-card-body">
              <div class="ad-chart-wrap"><canvas id="usersChart"></canvas></div>
            </div>
          </div>

          <div class="ad-card">
            <div class="ad-card-head">
              <h2 class="ad-card-title"><i class="fa-solid fa-chart-pie"></i> Subscriptions split</h2>
            </div>
            <div class="ad-card-body">
              <div class="ad-chart-wrap"><canvas id="subsChart"></canvas></div>
            </div>
          </div>
        </div>

        <!-- ═══════════════ RECENT ACTIVITY ═══════════════ -->
        <div class="ad-card">
          <div class="ad-card-head">
            <h2 class="ad-card-title"><i class="fa-solid fa-clock-rotate-left"></i> Recent Activity</h2>
            <a href="/admin/live-matches.html" class="ad-btn ad-btn-ghost ad-btn-sm">View all</a>
          </div>
          <div class="ad-table-wrap">
            <table class="ad-table">
              <thead>
                <tr>
                  <th>Type</th>
                  <th>Title</th>
                  <th>Status</th>
                  <th>Date</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="activityBody">
                <tr><td colspan="5"><div class="ad-skeleton" style="height:52px"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="ad-toast-wrap" id="adToastWrap"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/admin/admin-api.js"></script>
  <script src="/js/admin/admin-shell.js?v=2"></script>
  <script src="/js/admin/dashboard.js?v=2"></script>
</body>
</html>
