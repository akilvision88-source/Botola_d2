<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#A200C7" />
  <title>Subscriptions — BOTOLA D2 Admin</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>

  <div class="ad-layout" id="adLayout">
    <aside class="ad-sidebar" id="adSidebar"></aside>
    <div class="ad-sidebar-overlay" id="adSidebarOverlay"></div>

    <div class="ad-main">
      <header class="ad-topbar" id="adTopbar"></header>

      <div class="ad-content">
        <div class="ad-page-head">
          <div>
            <h1 class="ad-page-title">Subscriptions</h1>
            <p class="ad-page-sub">Manage plans and view subscriber activity</p>
          </div>
        </div>

        <!-- Tabs -->
        <div style="display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--ad-border)">
          <button class="sub-tab active" data-tab="plans">Plans</button>
          <button class="sub-tab" data-tab="history">Subscription History</button>
        </div>

        <!-- PLANS PANEL -->
        <div class="sub-panel" data-panel="plans">
          <div class="ad-page-actions" style="margin-bottom:16px;justify-content:flex-end">
            <button class="ad-btn ad-btn-primary ad-btn-sm" id="addPlanBtn">
              <i class="fa-solid fa-plus"></i> Add Plan
            </button>
          </div>
          <div class="ad-stats-grid" id="plansGrid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">
            <div class="ad-skeleton" style="height:260px;border-radius:16px"></div>
            <div class="ad-skeleton" style="height:260px;border-radius:16px"></div>
            <div class="ad-skeleton" style="height:260px;border-radius:16px"></div>
          </div>
        </div>

        <!-- HISTORY PANEL -->
        <div class="sub-panel" data-panel="history" style="display:none">
          <div class="ad-card">
            <div class="ad-card-head">
              <h2 class="ad-card-title"><i class="fa-solid fa-receipt"></i> All Subscriptions</h2>
              <span style="color:var(--bd-text-dim);font-size:12px" id="countLabel">—</span>
            </div>
            <div class="ad-table-wrap">
              <table class="ad-table">
                <thead>
                  <tr>
                    <th>User</th>
                    <th>Plan</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Start</th>
                    <th>End</th>
                    <th>Created</th>
                  </tr>
                </thead>
                <tbody id="subsBody">
                  <tr><td colspan="7"><div class="ad-skeleton" style="height:52px"></div></td></tr>
                </tbody>
              </table>
            </div>
            <div class="ad-pagination" id="subsPagination"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ PLAN MODAL ============ -->
  <div class="ad-modal" id="planModal">
    <div class="ad-modal-backdrop" data-modal-close></div>
    <div class="ad-modal-panel lg">
      <div class="ad-modal-head">
        <h3 class="ad-modal-title" id="modalTitle">Add Plan</h3>
        <button class="ad-modal-close" data-modal-close><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form id="planForm" class="ad-form" style="padding:22px">
        <input type="hidden" name="id" id="planId" />

        <div class="ad-form-grid">
          <div class="ad-field">
            <label>Name</label>
            <input type="text" name="name" required maxlength="60" placeholder="e.g. Gold" />
          </div>
          <div class="ad-field">
            <label>Slug <span class="hint">(lowercase, no spaces)</span></label>
            <input type="text" name="slug" required maxlength="60" placeholder="e.g. gold" pattern="[a-z0-9_-]+" />
          </div>
        </div>

        <div class="ad-field">
          <label>Description</label>
          <input type="text" name="description" maxlength="255" placeholder="Short description..." />
        </div>

        <div class="ad-form-grid-3">
          <div class="ad-field">
            <label>Price</label>
            <input type="number" name="price" min="0" step="0.01" value="0" required />
          </div>
          <div class="ad-field">
            <label>Currency</label>
            <input type="text" name="currency" maxlength="10" value="MAD" />
          </div>
          <div class="ad-field">
            <label>Duration (days)</label>
            <input type="number" name="duration_days" min="1" max="9999" value="30" />
          </div>
        </div>

        <div class="ad-field">
          <label>Features <span class="hint">(one per line)</span></label>
          <textarea name="features" rows="5" placeholder="Live Matches&#10;Replay Access&#10;HD Streaming"></textarea>
        </div>

        <!-- ✅ Display Order فقط -->
        <div class="ad-field">
          <label>Display Order</label>
          <input type="number" name="display_order" min="0" value="0" />
        </div>

        <div style="display:flex;justify-content:flex-end;gap:10px;padding-top:10px;border-top:1px solid var(--ad-border);margin-top:6px">
          <button type="button" class="ad-btn ad-btn-ghost" data-modal-close>Cancel</button>
          <button type="submit" class="ad-btn ad-btn-primary" id="saveBtn">
            <i class="fa-solid fa-floppy-disk"></i> Save Plan
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="ad-toast-wrap" id="adToastWrap"></div>

  <script src="/js/config.js"></script>
  <script src="/js/admin/admin-api.js"></script>
  <script src="/js/admin/admin-shell.js"></script>
  <script src="/js/admin/subscriptions.js?v=2"></script>
</body>
</html>
