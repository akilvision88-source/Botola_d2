<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#A200C7" />
  <title>Results — BOTOLA D2 Admin</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>

  <div class="ad-layout" id="adLayout">
    <aside class="ad-sidebar" id="adSidebar"></aside>
    <div class="ad-sidebar-overlay" id="adSidebarOverlay"></div>

    <div class="ad-main">
      <header class="ad-topbar" id="adTopbar"></header>

      <div class="ad-content">
        <div class="ad-page-head">
          <div>
            <h1 class="ad-page-title">Results</h1>
            <p class="ad-page-sub">Manage finished matches, goals, cards & statistics</p>
          </div>
          <div class="ad-page-actions">
            <button class="ad-btn ad-btn-ghost ad-btn-sm" id="refreshBtn">
              <i class="fa-solid fa-rotate"></i> Refresh
            </button>
            <button class="ad-btn ad-btn-primary ad-btn-sm" id="addBtn">
              <i class="fa-solid fa-plus"></i> Add Result
            </button>
          </div>
        </div>

        <div class="ad-card">
          <div class="ad-card-body" style="padding:16px 20px">
            <div class="ad-form-grid" style="gap:14px">
              <div class="ad-field">
                <label>Search</label>
                <input type="text" id="filterSearch" placeholder="Team / city / competition..." />
              </div>
              <div class="ad-field">
                <label>Date</label>
                <input type="date" id="filterDate" />
              </div>
            </div>
          </div>
        </div>

        <div class="ad-card">
          <div class="ad-card-head">
            <h2 class="ad-card-title"><i class="fa-solid fa-futbol"></i> Finished Matches</h2>
            <span style="color:var(--bd-text-dim);font-size:12px" id="countLabel">—</span>
          </div>
          <div class="ad-table-wrap">
            <table class="ad-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Match</th>
                  <th>Score</th>
                  <th>Goals</th>
                  <th>Competition</th>
                  <th style="text-align:right">Actions</th>
                </tr>
              </thead>
              <tbody id="resultsBody">
                <tr><td colspan="6"><div class="ad-skeleton" style="height:52px"></div></td></tr>
              </tbody>
            </table>
          </div>
          <div class="ad-pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== RESULT MODAL ========== -->
  <div class="ad-modal" id="resultModal">
    <div class="ad-modal-backdrop" data-modal-close></div>
    <div class="ad-modal-panel lg">
      <div class="ad-modal-head">
        <h3 class="ad-modal-title" id="resultModalTitle">Match Result</h3>
        <button class="ad-modal-close" data-modal-close><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="ad-modal-body">
        <!-- Tabs -->
        <div style="display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--ad-border);padding-bottom:0">
          <button class="result-tab active" data-tab="info">Info</button>
          <button class="result-tab" data-tab="goals">Goals</button>
          <button class="result-tab" data-tab="cards">Cards</button>
          <button class="result-tab" data-tab="stats">Statistics</button>
        </div>

        <!-- INFO TAB -->
        <div class="result-panel" data-panel="info">
          <form id="resultForm" class="ad-form">
            <input type="hidden" name="id" id="resultMatchId" />

            <div class="ad-form-grid">
              <div class="ad-field">
                <label>Competition</label>
                <input type="text" name="competition" value="Botola D2" required maxlength="120" />
              </div>
              <div class="ad-field">
                <label>Round</label>
                <input type="text" name="round" maxlength="50" />
              </div>
            </div>

            <div class="ad-form-grid">
              <div class="ad-field">
                <label>Home Team</label>
                <select name="team_home_id" id="resTeamHome" required></select>
              </div>
              <div class="ad-field">
                <label>Away Team</label>
                <select name="team_away_id" id="resTeamAway" required></select>
              </div>
            </div>

            <div class="ad-form-grid-3">
              <div class="ad-field">
                <label>Home Score</label>
                <input type="number" name="score_home" min="0" max="99" value="0" />
              </div>
              <div class="ad-field">
                <label>Away Score</label>
                <input type="number" name="score_away" min="0" max="99" value="0" />
              </div>
              <div class="ad-field">
                <label>Status</label>
                <select name="status">
                  <option value="finished" selected>Finished</option>
                  <option value="live">Live</option>
                  <option value="halftime">Half-time</option>
                  <option value="upcoming">Upcoming</option>
                  <option value="postponed">Postponed</option>
                  <option value="cancelled">Cancelled</option>
                </select>
              </div>
            </div>

            <div class="ad-form-grid-3">
              <div class="ad-field">
                <label>Date</label>
                <input type="date" name="match_date" required />
              </div>
              <div class="ad-field">
                <label>Time</label>
                <input type="time" name="match_time" required />
              </div>
              <div class="ad-field">
                <label>Match Minute</label>
                <input type="number" name="match_minute" min="0" max="130" value="90" />
              </div>
            </div>

            <div class="ad-form-grid">
              <div class="ad-field">
                <label>Stadium</label>
                <select name="stadium_id" id="resStadium"></select>
              </div>
              <div class="ad-field">
                <label>City</label>
                <input type="text" name="city" maxlength="100" />
              </div>
            </div>

            <div class="ad-form-grid">
              <div class="ad-field">
                <label>Referee</label>
                <input type="text" name="referee" maxlength="120" />
              </div>
              <div class="ad-field">
                <label>Attendance</label>
                <input type="number" name="attendance" min="0" />
              </div>
            </div>

            <div style="display:flex;justify-content:flex-end;gap:10px;padding-top:10px;border-top:1px solid var(--ad-border)">
              <button type="button" class="ad-btn ad-btn-ghost" data-modal-close>Cancel</button>
              <button type="submit" class="ad-btn ad-btn-primary" id="saveResultBtn">
                <i class="fa-solid fa-floppy-disk"></i> Save
              </button>
            </div>
          </form>
        </div>

        <!-- GOALS TAB -->
        <div class="result-panel" data-panel="goals" style="display:none">
          <div id="goalsIntro" style="color:var(--bd-text-muted);font-size:13px;margin-bottom:16px">
            Add goals for this match. Save the match first if it's new.
          </div>

          <form id="goalForm" class="ad-form" style="padding:16px;background:var(--ad-bg-2);border-radius:12px;margin-bottom:20px">
            <div class="ad-form-grid-3">
              <div class="ad-field">
                <label>Team</label>
                <select name="team_id" id="goalTeam" required></select>
              </div>
              <div class="ad-field">
                <label>Player</label>
                <input type="text" name="player_name" required maxlength="120" />
              </div>
              <div class="ad-field">
                <label>Minute</label>
                <input type="number" name="minute" min="1" max="130" required />
              </div>
            </div>
            <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center">
              <label class="ad-toggle">
                <input type="checkbox" name="is_penalty" />
                <span class="switch"></span>
                <span>Penalty</span>
              </label>
              <label class="ad-toggle">
                <input type="checkbox" name="is_own_goal" />
                <span class="switch"></span>
                <span>Own Goal</span>
              </label>
              <button type="submit" class="ad-btn ad-btn-primary ad-btn-sm" style="margin-left:auto">
                <i class="fa-solid fa-plus"></i> Add Goal
              </button>
            </div>
          </form>

          <div id="goalsList"></div>
        </div>

        <!-- CARDS TAB -->
        <div class="result-panel" data-panel="cards" style="display:none">
          <form id="cardForm" class="ad-form" style="padding:16px;background:var(--ad-bg-2);border-radius:12px;margin-bottom:20px">
            <div class="ad-form-grid-3">
              <div class="ad-field">
                <label>Team</label>
                <select name="team_id" id="cardTeam" required></select>
              </div>
              <div class="ad-field">
                <label>Player</label>
                <input type="text" name="player_name" required maxlength="120" />
              </div>
              <div class="ad-field">
                <label>Card Type</label>
                <select name="card_type" required>
                  <option value="yellow">Yellow</option>
                  <option value="red">Red</option>
                  <option value="second_yellow">Second Yellow</option>
                </select>
              </div>
            </div>
            <div class="ad-form-grid-2" style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
              <div class="ad-field">
                <label>Minute</label>
                <input type="number" name="minute" min="1" max="130" required />
              </div>
              <div style="display:flex;align-items:flex-end">
                <button type="submit" class="ad-btn ad-btn-primary ad-btn-sm">
                  <i class="fa-solid fa-plus"></i> Add Card
                </button>
              </div>
            </div>
          </form>

          <div id="cardsList"></div>
        </div>

        <!-- STATS TAB -->
        <div class="result-panel" data-panel="stats" style="display:none">
          <form id="statsForm" class="ad-form">
            <input type="hidden" name="id" id="statsMatchId" />
            <div class="ad-form-grid-3" style="gap:14px">
              <div class="ad-field"><label>Possession Home (%)</label><input type="number" name="possession_home" min="0" max="100" value="50" /></div>
              <div class="ad-field"><label>Possession Away (%)</label><input type="number" name="possession_away" min="0" max="100" value="50" /></div>
              <div></div>
              <div class="ad-field"><label>Shots Home</label><input type="number" name="shots_home" min="0" value="0" /></div>
              <div class="ad-field"><label>Shots Away</label><input type="number" name="shots_away" min="0" value="0" /></div>
              <div></div>
              <div class="ad-field"><label>Shots on Target Home</label><input type="number" name="shots_on_target_home" min="0" value="0" /></div>
              <div class="ad-field"><label>Shots on Target Away</label><input type="number" name="shots_on_target_away" min="0" value="0" /></div>
              <div></div>
              <div class="ad-field"><label>Corners Home</label><input type="number" name="corners_home" min="0" value="0" /></div>
              <div class="ad-field"><label>Corners Away</label><input type="number" name="corners_away" min="0" value="0" /></div>
              <div></div>
              <div class="ad-field"><label>Fouls Home</label><input type="number" name="fouls_home" min="0" value="0" /></div>
              <div class="ad-field"><label>Fouls Away</label><input type="number" name="fouls_away" min="0" value="0" /></div>
              <div></div>
              <div class="ad-field"><label>Offsides Home</label><input type="number" name="offsides_home" min="0" value="0" /></div>
              <div class="ad-field"><label>Offsides Away</label><input type="number" name="offsides_away" min="0" value="0" /></div>
            </div>
            <div style="display:flex;justify-content:flex-end;gap:10px;padding-top:14px;border-top:1px solid var(--ad-border);margin-top:8px">
              <button type="submit" class="ad-btn ad-btn-primary" id="saveStatsBtn">
                <i class="fa-solid fa-floppy-disk"></i> Save Statistics
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div class="ad-toast-wrap" id="adToastWrap"></div>

  <script src="/js/config.js"></script>
  <script src="/js/admin/admin-api.js"></script>
  <script src="/js/admin/admin-shell.js"></script>
  <script src="/js/admin/results.js"></script>
</body>
</html>
