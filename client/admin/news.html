<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>News Ticker — BOTOLA D2 Admin</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
  <div class="ad-layout" id="adLayout">
    <aside class="ad-sidebar" id="adSidebar"></aside>
    <div class="ad-sidebar-overlay" id="adSidebarOverlay"></div>

    <div class="ad-main">
      <header class="ad-topbar" id="adTopbar"></header>

      <div class="ad-content">
        <div class="ad-page-head">
          <div>
            <h1 class="ad-page-title">News Ticker</h1>
            <p class="ad-page-sub">Manage the scrolling news bar on the home page</p>
          </div>
          <div class="ad-page-actions">
            <button class="ad-btn ad-btn-ghost ad-btn-sm" id="refreshBtn">
              <i class="fa-solid fa-rotate"></i> Refresh
            </button>
            <button class="ad-btn ad-btn-primary ad-btn-sm" id="addBtn">
              <i class="fa-solid fa-plus"></i> Add Ticker
            </button>
          </div>
        </div>

        <div class="ad-card">
          <div class="ad-card-head">
            <h2 class="ad-card-title"><i class="fa-solid fa-bullhorn"></i> Active Tickers</h2>
            <span style="color:var(--bd-text-dim);font-size:12px" id="countLabel">—</span>
          </div>
          <div class="ad-table-wrap">
            <table class="ad-table">
              <thead>
                <tr>
                  <th style="width:60px">Order</th>
                  <th style="width:60px">Icon</th>
                  <th>Message</th>
                  <th style="width:90px">Color</th>
                  <th style="width:100px">Status</th>
                  <th style="width:120px">Actions</th>
                </tr>
              </thead>
              <tbody id="tickerBody">
                <tr><td colspan="6"><div class="ad-skeleton" style="height:52px"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div class="ad-modal" id="tickerModal">
    <div class="ad-modal-backdrop" data-modal-close></div>
    <div class="ad-modal-panel">
      <div class="ad-modal-head">
        <h3 class="ad-modal-title" id="modalTitle">Add Ticker</h3>
        <button class="ad-modal-close" data-modal-close><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="tickerForm" class="ad-form" style="padding:22px">
        <input type="hidden" name="id" id="tickerId" />

        <div class="ad-field">
          <label>Message *</label>
          <textarea name="message" rows="2" required maxlength="500" placeholder="نص الشريط الإخباري..."></textarea>
        </div>

        <div class="ad-form-grid">
          <div class="ad-field">
            <label>Icon (Font Awesome)</label>
            <input type="text" name="icon" maxlength="50" placeholder="fa-bullhorn" value="fa-bullhorn" />
            <div class="hint">مثل: fa-bullhorn، fa-calendar، fa-crown، fa-fire، fa-bolt</div>
          </div>
          <div class="ad-field">
            <label>Color</label>
            <select name="color">
              <option value="primary">🟣 Primary (بنفسجي)</option>
              <option value="success">🟢 Success (أخضر)</option>
              <option value="warning">🟡 Warning (ذهبي)</option>
              <option value="danger">🔴 Danger (أحمر)</option>
              <option value="info">🔵 Info (أزرق)</option>
            </select>
          </div>
        </div>

        <div class="ad-form-grid">
          <div class="ad-field">
            <label>Display Order</label>
            <input type="number" name="display_order" min="0" value="0" />
          </div>
          <div class="ad-field">
            <label>Active</label>
            <select name="is_active">
              <option value="1">Yes</option>
              <option value="0">No</option>
            </select>
          </div>
        </div>

        <div class="ad-form-grid">
          <div class="ad-field">
            <label>Link URL <span class="hint">(optional)</span></label>
            <input type="url" name="link_url" maxlength="500" placeholder="https://..." />
          </div>
          <div class="ad-field">
            <label>Link Text <span class="hint">(optional)</span></label>
            <input type="text" name="link_text" maxlength="100" placeholder="Read more" />
          </div>
        </div>

        <div class="ad-form-grid">
          <div class="ad-field">
            <label>Starts At <span class="hint">(optional)</span></label>
            <input type="datetime-local" name="starts_at" />
          </div>
          <div class="ad-field">
            <label>Ends At <span class="hint">(optional)</span></label>
            <input type="datetime-local" name="ends_at" />
          </div>
        </div>

        <div style="display:flex;justify-content:flex-end;gap:10px;padding-top:10px;border-top:1px solid var(--ad-border)">
          <button type="button" class="ad-btn ad-btn-ghost" data-modal-close>Cancel</button>
          <button type="submit" class="ad-btn ad-btn-primary" id="saveBtn">
            <i class="fa-solid fa-floppy-disk"></i> Save
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="ad-toast-wrap" id="adToastWrap"></div>

  <script src="/js/config.js"></script>
  <script src="/js/admin/admin-api.js"></script>
  <script src="/js/admin/admin-shell.js"></script>
  <script>
    let currentTickers = [];

    document.addEventListener('DOMContentLoaded', async () => {
      const user = await AdminShell.mount('news', 'News Ticker');
      if (!user) return;

      document.getElementById('addBtn').addEventListener('click', () => openModal(null));
      document.getElementById('refreshBtn').addEventListener('click', loadTickers);
      document.getElementById('tickerForm').addEventListener('submit', onSave);

      loadTickers();
    });

    async function loadTickers() {
      const tbody = document.getElementById('tickerBody');
      AdUtil.showTableSkeleton(tbody, 6, 5);

      try {
        const res = await fetch('/api/news?_t=' + Date.now(), {
          headers: { 'Authorization': 'Bearer ' + localStorage.getItem('bd_access_token') }
        }).then(r => r.json());

        currentTickers = res?.data || [];
        document.getElementById('countLabel').textContent = `${currentTickers.length} total`;

        if (!currentTickers.length) {
          tbody.innerHTML = AdUtil.emptyRow(6, 'No tickers yet');
          return;
        }

        tbody.innerHTML = currentTickers.map(t => `
          <tr>
            <td><span class="ad-pill">${t.display_order}</span></td>
            <td><i class="fa-solid ${AdUtil.esc(t.icon || 'fa-bullhorn')}" style="font-size:18px;color:var(--bd-primary)"></i></td>
            <td><strong>${AdUtil.esc(t.message)}</strong>${t.link_url ? `<br><small style="color:var(--bd-text-dim)">🔗 ${AdUtil.esc(t.link_text || t.link_url)}</small>` : ''}</td>
            <td><span class="ad-pill ${t.color}">${t.color.toUpperCase()}</span></td>
            <td>${t.is_active ? '<span class="ad-pill active">ACTIVE</span>' : '<span class="ad-pill finished">HIDDEN</span>'}</td>
            <td>
              <div class="ad-row-actions">
                <button class="ad-row-btn" data-action="edit" data-id="${t.id}"><i class="fa-solid fa-pen"></i></button>
                <button class="ad-row-btn danger" data-action="delete" data-id="${t.id}"><i class="fa-solid fa-trash"></i></button>
              </div>
            </td>
          </tr>
        `).join('');

        tbody.querySelectorAll('[data-action="edit"]').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-id');
            const t = currentTickers.find(x => String(x.id) === String(id));
            openModal(t);
          });
        });

        tbody.querySelectorAll('[data-action="delete"]').forEach(btn => {
          btn.addEventListener('click', async () => {
            const id = btn.getAttribute('data-id');
            const ok = await AdUtil.confirmDialog('Delete ticker?', 'This action cannot be undone.', 'Delete');
            if (!ok) return;
            try {
              await fetch('/api/news/' + id, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + localStorage.getItem('bd_access_token') }
              });
              AdToast.success('Ticker deleted');
              loadTickers();
            } catch (err) {
              AdToast.error('Delete failed');
            }
          });
        });
      } catch (err) {
        tbody.innerHTML = AdUtil.emptyRow(6, 'Failed to load');
      }
    }

    function openModal(t) {
      const form = document.getElementById('tickerForm');
      form.reset();

      const isEdit = !!t;
      document.getElementById('modalTitle').textContent = isEdit ? 'Edit Ticker' : 'Add Ticker';

      if (isEdit) {
        form.id.value = t.id;
        form.message.value = t.message || '';
        form.icon.value = t.icon || 'fa-bullhorn';
        form.color.value = t.color || 'primary';
        form.display_order.value = t.display_order || 0;
        form.is_active.value = t.is_active ? '1' : '0';
        form.link_url.value = t.link_url || '';
        form.link_text.value = t.link_text || '';
        form.starts_at.value = t.starts_at ? t.starts_at.slice(0, 16) : '';
        form.ends_at.value = t.ends_at ? t.ends_at.slice(0, 16) : '';
      }

      AdUtil.openModal('tickerModal');
    }

    async function onSave(e) {
      e.preventDefault();
      const form = e.currentTarget;

      const payload = {
        message: form.message.value.trim(),
        icon: form.icon.value.trim() || 'fa-bullhorn',
        color: form.color.value,
        display_order: parseInt(form.display_order.value, 10) || 0,
        is_active: form.is_active.value === '1',
        link_url: form.link_url.value.trim() || null,
        link_text: form.link_text.value.trim() || null,
        starts_at: form.starts_at.value || null,
        ends_at: form.ends_at.value || null
      };

      if (!payload.message) {
        AdToast.error('Message is required');
        return;
      }

      const btn = document.getElementById('saveBtn');
      const orig = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';

      const id = form.id.value;
      const url = id ? '/api/news/' + id : '/api/news';
      const method = id ? 'PUT' : 'POST';

      try {
        const res = await fetch(url, {
          method,
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + localStorage.getItem('bd_access_token')
          },
          body: JSON.stringify(payload)
        }).then(r => r.json());

        if (!res.success) throw new Error(res.message);

        AdToast.success(id ? 'Ticker updated' : 'Ticker created');
        AdUtil.closeModal('tickerModal');
        loadTickers();
      } catch (err) {
        AdToast.error(err.message || 'Save failed');
      } finally {
        btn.disabled = false;
        btn.innerHTML = orig;
      }
    }
  </script>
</body>
</html>
