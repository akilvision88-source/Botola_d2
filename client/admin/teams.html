<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#A200C7" />
  <title>Teams — BOTOLA D2 Admin</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>

  <div class="ad-layout" id="adLayout">
    <aside class="ad-sidebar" id="adSidebar"></aside>
    <div class="ad-sidebar-overlay" id="adSidebarOverlay"></div>

    <div class="ad-main">
      <header class="ad-topbar" id="adTopbar"></header>

      <div class="ad-content">
        <div class="ad-page-head">
          <div>
            <h1 class="ad-page-title">Teams</h1>
            <p class="ad-page-sub">Manage clubs, logos and stadiums</p>
          </div>
          <div class="ad-page-actions">
            <button class="ad-btn ad-btn-ghost ad-btn-sm" id="refreshBtn">
              <i class="fa-solid fa-rotate"></i> Refresh
            </button>
            <button class="ad-btn ad-btn-primary ad-btn-sm" id="addBtn">
              <i class="fa-solid fa-plus"></i> Add Team
            </button>
          </div>
        </div>

        <div class="ad-card">
          <div class="ad-card-body" style="padding:16px 20px">
            <div class="ad-field">
              <label>Search</label>
              <input type="text" id="filterSearch" placeholder="Search by name or city..." />
            </div>
          </div>
        </div>

        <div class="ad-card">
          <div class="ad-card-head">
            <h2 class="ad-card-title"><i class="fa-solid fa-shield-halved"></i> All Teams</h2>
            <span style="color:var(--bd-text-dim);font-size:12px" id="countLabel">—</span>
          </div>
          <div class="ad-table-wrap">
            <table class="ad-table">
              <thead>
                <tr>
                  <th style="width:60px">Logo</th>
                  <th>Name</th>
                  <th>Short</th>
                  <th>City</th>
                  <th>Stadium</th>
                  <th>Founded</th>
                  <th>Status</th>
                  <th style="text-align:right">Actions</th>
                </tr>
              </thead>
              <tbody id="teamsBody">
                <tr><td colspan="8"><div class="ad-skeleton" style="height:52px"></div></td></tr>
              </tbody>
            </table>
          </div>
          <div class="ad-pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ TEAM MODAL ============ -->
  <div class="ad-modal" id="teamModal">
    <div class="ad-modal-backdrop" data-modal-close></div>
    <div class="ad-modal-panel">
      <div class="ad-modal-head">
        <h3 class="ad-modal-title" id="modalTitle">Add Team</h3>
        <button class="ad-modal-close" data-modal-close><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form id="teamForm" class="ad-form" style="padding:22px">
        <input type="hidden" name="id" id="teamId" />

        <div class="ad-form-grid">
          <div class="ad-field">
            <label>Team Name</label>
            <input type="text" name="name" required maxlength="120" placeholder="e.g. Raja Club Athletic" />
          </div>
          <div class="ad-field">
            <label>Short Name</label>
            <input type="text" name="short_name" maxlength="20" placeholder="e.g. RCA" />
          </div>
        </div>

        <div class="ad-form-grid">
          <div class="ad-field">
            <label>City</label>
            <input type="text" name="city" maxlength="100" placeholder="e.g. Casablanca" />
          </div>
          <div class="ad-field">
            <label>Founded Year</label>
            <input type="number" name="founded_year" min="1800" max="2100" placeholder="e.g. 1949" />
          </div>
        </div>

        <div class="ad-field">
          <label>Home Stadium</label>
          <select name="stadium_id" id="stadiumSelect">
            <option value="">— None —</option>
          </select>
        </div>

        <div class="ad-field">
          <label>Description</label>
          <textarea name="description" maxlength="2000" placeholder="Optional club description..."></textarea>
        </div>

        <div class="ad-field">
          <label>Status</label>
          <select name="status">
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>

        <div class="ad-upload">
          <div class="ad-upload-preview" id="logoPreview">
            <i class="fa-regular fa-image"></i>
          </div>
          <div class="ad-upload-input">
            <label for="logoInput">
              <i class="fa-solid fa-upload"></i> Upload logo
            </label>
            <input type="file" id="logoInput" name="logo" accept="image/*" />
            <div style="color:var(--bd-text-dim);font-size:11px;margin-top:8px">
              PNG with transparent background recommended · max 5MB
            </div>
          </div>
        </div>

        <div style="display:flex;justify-content:flex-end;gap:10px;padding-top:10px;border-top:1px solid var(--ad-border);margin-top:6px">
          <button type="button" class="ad-btn ad-btn-ghost" data-modal-close>Cancel</button>
          <button type="submit" class="ad-btn ad-btn-primary" id="saveBtn">
            <i class="fa-solid fa-floppy-disk"></i> Save Team
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="ad-toast-wrap" id="adToastWrap"></div>

  <script src="/js/config.js"></script>
  <script src="/js/admin/admin-api.js"></script>
  <script src="/js/admin/admin-shell.js"></script>
  <script src="/js/admin/teams.js"></script>
</body>
</html>
