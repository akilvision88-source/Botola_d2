<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#A200C7" />
  <title>Paiement — BOTOLA D2</title>
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body data-page="payment">

  <!-- Header injected by /js/header.js -->

  <section class="bd-page-head">
    <div class="container-xl">
      <div class="bd-page-head-inner">
        <div>
          <div class="bd-page-crumb">
            <a href="/subscription" data-i18n="nav.subscription">Subscription</a> <span>/</span>
            <span data-i18n="payment.title">Paiement</span>
          </div>
          <h1 class="bd-page-title"><i class="fa-solid fa-credit-card"></i> <span data-i18n="payment.title">Finaliser le paiement</span></h1>
        </div>
      </div>
    </div>
  </section>

  <section class="bd-section" style="padding-top: 32px;">
    <div class="container-xl">
      <div id="paymentLoading" class="text-center" style="padding: 60px 0;">
        <div class="skeleton" style="height: 400px; border-radius: 22px;"></div>
      </div>

      <div id="paymentContent" style="display: none;">
        <div class="payment-layout">

          <!-- Résumé de la commande -->
          <div class="payment-summary-card">
            <h2 class="payment-summary-title"><i class="fa-solid fa-receipt"></i> <span data-i18n="payment.summary">Résumé de la commande</span></h2>
            <div id="orderSummary" class="payment-summary-body"></div>
          </div>

          <!-- Méthodes de paiement -->
          <div class="payment-methods-card">
            <h2 class="payment-summary-title"><i class="fa-solid fa-wallet"></i> <span data-i18n="payment.method">Méthode de paiement</span></h2>

            <div class="payment-methods-grid">
              <button type="button" class="payment-method-btn" data-method="visa">
                <i class="fa-brands fa-cc-visa"></i>
                <span>Visa</span>
              </button>
              <button type="button" class="payment-method-btn" data-method="mastercard">
                <i class="fa-brands fa-cc-mastercard"></i>
                <span>Mastercard</span>
              </button>
              <button type="button" class="payment-method-btn" data-method="paypal">
                <i class="fa-brands fa-cc-paypal"></i>
                <span>PayPal</span>
              </button>
              <button type="button" class="payment-method-btn" data-method="wafacash">
                <i class="fa-solid fa-money-bill-wave"></i>
                <span>Wafacash</span>
              </button>
              <button type="button" class="payment-method-btn" data-method="cashplus">
                <i class="fa-solid fa-building-columns"></i>
                <span>Cash Plus</span>
              </button>
            </div>

            <div id="paymentDetails" class="payment-details-box" style="display: none;"></div>

            <button type="button" class="btn-bd btn-bd-primary btn-bd-lg btn-bd-block" id="payBtn" disabled>
              <i class="fa-solid fa-lock"></i> <span data-i18n="payment.pay_now">Payer maintenant</span>
            </button>
          </div>

        </div>
      </div>
    </div>
  </section>

  <div class="bd-toast-wrap" id="toastWrap"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/share.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/payment.js"></script>
</body>
</html>
