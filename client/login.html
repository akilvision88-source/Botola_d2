<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#A200C7" />
  <title>Login — BOTOLA D2</title>
  <meta name="description" content="Log in to BOTOLA D2 — watch live matches, replays and follow your favorite teams." />
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/components.css?v=31" />
  <link rel="stylesheet" href="/css/responsive.css?v=2" />
  <link rel="stylesheet" href="/css/rtl.css" />
</head>
<body data-page="login" class="auth-body">

  <!-- Header/Menu/BottomNav — injected by /js/header.js -->

  <main class="auth-shell">
    <div class="auth-aurora"></div>

    <div class="auth-card">
      <div class="auth-brand">
        <span class="bd-logo" style="font-size:26px">
          <span class="bd-logo-mark"><span class="bd-logo-dot"></span>BOTOLA</span>
          <span class="bd-logo-d2" style="font-size:28px">D2</span>
        </span>
      </div>

      <h1 class="auth-title" data-i18n="auth.welcome_back">Welcome back</h1>
      <p class="auth-subtitle" data-i18n="auth.login_subtitle">Sign in to continue watching your favorite matches.</p>

      <form id="loginForm" novalidate>
        <div class="form-field">
          <label for="loginEmail" data-i18n="auth.email">Email</label>
          <div class="input-with-icon">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="loginEmail" name="email" autocomplete="email" required placeholder="you@example.com" />
          </div>
          <span class="form-error" data-error-for="email"></span>
        </div>

        <div class="form-field">
          <label for="loginPassword" data-i18n="auth.password">Password</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="loginPassword" name="password" autocomplete="current-password" required placeholder="••••••••" />
            <button type="button" class="input-toggle" data-toggle-password="loginPassword" aria-label="Show password">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
          <span class="form-error" data-error-for="password"></span>
        </div>

        <div class="auth-row">
          <label class="checkbox">
            <input type="checkbox" name="remember" />
            <span></span>
            <span data-i18n="auth.remember">Remember me</span>
          </label>
          <a href="/forgot-password" class="auth-link" data-i18n="auth.forgot">Forgot password?</a>
        </div>

        <button type="submit" class="btn-bd btn-bd-primary btn-bd-lg btn-bd-block" id="loginSubmit">
          <i class="fa-solid fa-right-to-bracket"></i> <span data-i18n="auth.login_btn">LOG IN</span>
        </button>
      </form>

      <div class="auth-divider"><span data-i18n="auth.or">or</span></div>

      <div class="auth-alt-action">
        <span data-i18n="auth.no_account">Don't have an account?</span>
        <a href="/register" class="auth-link strong" data-i18n="auth.create_one">Create one</a>
      </div>
    </div>
  </main>

  <div class="bd-toast-wrap" id="toastWrap"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/auth-pages.js"></script>
</body>
</html>
