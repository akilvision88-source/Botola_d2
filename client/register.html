<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#A200C7" />
  <title>Register — BOTOLA D2</title>
  <meta name="description" content="Create your free BOTOLA D2 account — watch live matches, replays and premium content." />
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/components.css?v=31" />
  <link rel="stylesheet" href="/css/responsive.css?v=2" />
  <link rel="stylesheet" href="/css/rtl.css" />
</head>
<body data-page="register" class="auth-body">

  <!-- Header/Menu/BottomNav — injected by /js/header.js -->

  <main class="auth-shell">
    <div class="auth-aurora"></div>

    <div class="auth-card">
      <div class="auth-brand">
        <span class="bd-logo" style="font-size:26px">
          <span class="bd-logo-mark"><span class="bd-logo-dot"></span>BOTOLA</span>
          <span class="bd-logo-d2" style="font-size:28px">D2</span>
        </span>
      </div>

      <h1 class="auth-title" data-i18n="auth.create_account">Create your account</h1>
      <p class="auth-subtitle" data-i18n="auth.register_subtitle">Join BOTOLA D2 and follow every match live.</p>

      <form id="registerForm" novalidate>
        <div class="form-field">
          <label for="regName" data-i18n="auth.full_name">Full name</label>
          <div class="input-with-icon">
            <i class="fa-regular fa-user"></i>
            <input type="text" id="regName" name="full_name" autocomplete="name" required maxlength="120" placeholder="John Doe" />
          </div>
          <span class="form-error" data-error-for="full_name"></span>
        </div>

        <div class="form-grid-2">
          <div class="form-field">
            <label for="regEmail" data-i18n="auth.email">Email</label>
            <div class="input-with-icon">
              <i class="fa-regular fa-envelope"></i>
              <input type="email" id="regEmail" name="email" autocomplete="email" required placeholder="you@example.com" />
            </div>
            <span class="form-error" data-error-for="email"></span>
          </div>

          <div class="form-field">
            <label for="regPhone" data-i18n="auth.phone">Phone <span class="optional">(optional)</span></label>
            <div class="input-with-icon">
              <i class="fa-solid fa-phone"></i>
              <input type="tel" id="regPhone" name="phone" autocomplete="tel" maxlength="30" placeholder="+212 600 000 000" />
            </div>
            <span class="form-error" data-error-for="phone"></span>
          </div>
        </div>

        <div class="form-grid-2">
          <div class="form-field">
            <label for="regPassword" data-i18n="auth.password">Password</label>
            <div class="input-with-icon">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="regPassword" name="password" autocomplete="new-password" required placeholder="Min 8 chars" />
              <button type="button" class="input-toggle" data-toggle-password="regPassword" aria-label="Show password">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
            <div class="password-strength" id="pwStrength"><span></span></div>
            <span class="form-error" data-error-for="password"></span>
          </div>

          <div class="form-field">
            <label for="regConfirm" data-i18n="auth.confirm_password">Confirm password</label>
            <div class="input-with-icon">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="regConfirm" name="confirm_password" autocomplete="new-password" required placeholder="Repeat password" />
              <button type="button" class="input-toggle" data-toggle-password="regConfirm" aria-label="Show password">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
            <span class="form-error" data-error-for="confirm_password"></span>
          </div>
        </div>

        <label class="checkbox" style="margin-top:6px">
          <input type="checkbox" name="terms" required />
          <span></span>
          <span><span data-i18n="auth.agree">I agree to the</span> <a href="#" class="auth-link" data-i18n="footer.terms">Terms</a> <span data-i18n="auth.and">and</span> <a href="#" class="auth-link" data-i18n="footer.privacy">Privacy Policy</a>.</span>
        </label>
        <span class="form-error" data-error-for="terms"></span>

        <button type="submit" class="btn-bd btn-bd-primary btn-bd-lg btn-bd-block" id="registerSubmit" style="margin-top:10px">
          <i class="fa-solid fa-user-plus"></i> <span data-i18n="auth.register_btn">CREATE ACCOUNT</span>
        </button>
      </form>

      <div class="auth-divider"><span data-i18n="auth.or">or</span></div>

      <div class="auth-alt-action">
        <span data-i18n="auth.have_account">Already have an account?</span>
        <a href="/login" class="auth-link strong" data-i18n="auth.sign_in">Sign in</a>
      </div>
    </div>
  </main>

  <div class="bd-toast-wrap" id="toastWrap"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/auth-pages.js"></script>
</body>
</html>
