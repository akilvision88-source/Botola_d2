<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#A200C7" />
  <title>Forgot Password — BOTOLA D2</title>
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/components.css?v=31" />
  <link rel="stylesheet" href="/css/responsive.css?v=2" />
  <link rel="stylesheet" href="/css/rtl.css" />
</head>
<body data-page="forgot-password" class="auth-body">

  <!-- Header/Menu/BottomNav — injected by /js/header.js -->

  <main class="auth-shell">
    <div class="auth-aurora"></div>

    <div class="auth-card">
      <div class="auth-brand">
        <span class="bd-logo" style="font-size:26px">
          <span class="bd-logo-mark"><span class="bd-logo-dot"></span>BOTOLA</span>
          <span class="bd-logo-d2" style="font-size:28px">D2</span>
        </span>
      </div>

      <div class="auth-icon-badge"><i class="fa-solid fa-key"></i></div>

      <h1 class="auth-title" data-i18n="auth.forgot_title">Reset your password</h1>
      <p class="auth-subtitle" data-i18n="auth.forgot_subtitle">Enter your email address and we'll send you a link to reset your password.</p>

      <form id="forgotForm" novalidate>
        <div class="form-field">
          <label for="forgotEmail" data-i18n="auth.email">Email</label>
          <div class="input-with-icon">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="forgotEmail" name="email" autocomplete="email" required placeholder="you@example.com" />
          </div>
          <span class="form-error" data-error-for="email"></span>
        </div>

        <button type="submit" class="btn-bd btn-bd-primary btn-bd-lg btn-bd-block" id="forgotSubmit">
          <i class="fa-solid fa-paper-plane"></i> <span data-i18n="auth.send_link">SEND RESET LINK</span>
        </button>
      </form>

      <div class="auth-alt-action" style="margin-top:24px">
        <a href="/login" class="auth-link strong"><i class="fa-solid fa-arrow-left"></i> <span data-i18n="auth.back_login">Back to login</span></a>
      </div>
    </div>
  </main>

  <div class="bd-toast-wrap" id="toastWrap"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/auth-pages.js"></script>
</body>
</html>
