<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paiement réussi — BOTOLA D2</title>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body data-page="payment-success">
  <!-- Header injected -->

  <section class="bd-section" style="padding: 80px 0;">
    <div class="container-xl text-center">
      <div style="width: 90px; height: 90px; border-radius: 50%; background: rgba(34,197,94,0.15); color: #22C55E; display: inline-flex; align-items: center; justify-content: center; font-size: 40px; margin-bottom: 24px;">
        <i class="fa-solid fa-check"></i>
      </div>
      <h1 style="font-size: 32px; font-weight: 900; color: #fff; margin-bottom: 12px;">Paiement réussi !</h1>
      <p style="color: var(--bd-text-muted); font-size: 16px; margin-bottom: 32px;">
        Votre abonnement a été activé. Votre facture est prête à être téléchargée.
      </p>
      <a href="#" id="downloadInvoiceBtn" class="btn-bd btn-bd-primary btn-bd-lg">
        <i class="fa-solid fa-file-pdf"></i> Télécharger la facture PDF
      </a>
      <a href="/" class="btn-bd btn-bd-ghost btn-bd-lg" style="margin-left: 12px;">
        <i class="fa-solid fa-house"></i> Retour à l'accueil
      </a>
    </div>
  </section>

  <div class="bd-toast-wrap" id="toastWrap"></div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/header.js"></script>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const invoice = params.get('invoice');
      const btn = document.getElementById('downloadInvoiceBtn');
      if (invoice && btn) {
        btn.href = `${window.BD_CONFIG.API_BASE}/payments/invoice/${invoice}`;
      } else if (btn) {
        btn.style.display = 'none';
      }
    })();
  </script>
</body>
</html>
