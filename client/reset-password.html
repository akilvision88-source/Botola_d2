<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#A200C7" />
  <title>Reset Password — BOTOLA D2</title>
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/components.css?v=31" />
  <link rel="stylesheet" href="/css/responsive.css?v=2" />
  <link rel="stylesheet" href="/css/rtl.css" />
</head>
<body data-page="reset-password" class="auth-body">

  <!-- Header/Menu/BottomNav — injected by /js/header.js -->

  <main class="auth-shell">
    <div class="auth-aurora"></div>

    <div class="auth-card">
      <div class="auth-brand">
        <span class="bd-logo" style="font-size:26px">
          <span class="bd-logo-mark"><span class="bd-logo-dot"></span>BOTOLA</span>
          <span class="bd-logo-d2" style="font-size:28px">D2</span>
        </span>
      </div>

      <div class="auth-icon-badge"><i class="fa-solid fa-shield-halved"></i></div>

      <h1 class="auth-title" data-i18n="auth.reset_title">Set a new password</h1>
      <p class="auth-subtitle" data-i18n="auth.reset_subtitle">Choose a strong password for your account.</p>

      <form id="resetForm" novalidate>
        <div class="form-field">
          <label for="newPassword" data-i18n="auth.new_password">New password</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="newPassword" name="password" autocomplete="new-password" required placeholder="Min 8 chars" />
            <button type="button" class="input-toggle" data-toggle-password="newPassword" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
          </div>
          <div class="password-strength" id="pwStrength"><span></span></div>
          <span class="form-error" data-error-for="password"></span>
        </div>

        <div class="form-field">
          <label for="confirmNewPassword" data-i18n="auth.confirm_password">Confirm password</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="confirmNewPassword" name="confirm_password" autocomplete="new-password" required placeholder="Repeat password" />
            <button type="button" class="input-toggle" data-toggle-password="confirmNewPassword" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
          </div>
          <span class="form-error" data-error-for="confirm_password"></span>
        </div>

        <button type="submit" class="btn-bd btn-bd-primary btn-bd-lg btn-bd-block" id="resetSubmit">
          <i class="fa-solid fa-check"></i> <span data-i18n="auth.update_password">UPDATE PASSWORD</span>
        </button>
      </form>

      <div class="auth-alt-action" style="margin-top:24px">
        <a href="/login" class="auth-link strong"><i class="fa-solid fa-arrow-left"></i> <span data-i18n="auth.back_login">Back to login</span></a>
      </div>
    </div>
  </main>

  <div class="bd-toast-wrap" id="toastWrap"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/auth-pages.js"></script>
</body>
</html>
